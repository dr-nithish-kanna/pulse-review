<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulse Card Review</title>
<style>
:root { --bg:#f7f7f5; --panel:#fff; --ink:#1f2328; --muted:#5d6570; --line:#dcdfe3; --accent:#0b6b5b; --on-accent:#fff; --warn:#9a5b00; --warnbg:#fdf1dc; --evbg:#e8f3f0; --bad:#a3312a; }
@media (prefers-color-scheme: dark) { :root { --bg:#16181b; --panel:#1f2226; --ink:#e7e9ec; --muted:#a2a9b2; --line:#33383e; --accent:#6fd0bd; --on-accent:#10211d; --warn:#f0bd6c; --warnbg:#3a2e18; --evbg:#1c302c; --bad:#f09a93; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
main { max-width:680px; margin:0 auto; padding:16px 16px 96px; }
h1 { font-size:20px; margin:0; }
.bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
.pick { display:flex; gap:8px; margin-bottom:12px; }
.pick label { flex:1; font-size:13px; color:var(--muted); }
.pick select { display:block; width:100%; min-height:44px; margin-top:4px; padding:6px 8px; font:inherit; font-size:15px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; }
.tabs { display:flex; gap:6px; margin-bottom:12px; }
.tabs button { flex:1; min-height:44px; padding:6px 4px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; }
.tabs button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
article, .gate { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
.top { display:flex; flex-wrap:wrap; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
code { overflow-wrap:anywhere; }
.badge { font-size:12px; padding:1px 8px; border-radius:999px; background:var(--warnbg); color:var(--warn); border:1px solid var(--warn); }
.text { font-size:19px; margin:12px 0; white-space:pre-line; }
.badge.tier-high_yield { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
.badge.tier-core { background:var(--evbg); color:var(--accent); border-color:var(--accent); }
.badge.tier-later { background:none; color:var(--muted); border-color:var(--line); }
.morebox { width:100%; background:var(--evbg); border-radius:8px; padding:10px 12px; }
.morebox input[type=range] { width:100%; padding:0; margin:8px 0; accent-color:var(--accent); }
.morebox .count { font-weight:600; color:var(--ink); }
.morebox .row { display:flex; gap:8px; }
.morebox .row button { flex:1; }
.badge.more { background:var(--evbg); color:var(--accent); border-color:var(--accent); }
.badge.kind { background:var(--evbg); color:var(--accent); border-color:var(--accent); margin:0 6px 0 0; }
.cardtools { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.cardtools label { font-size:14px; color:var(--muted); }
.cardtools select { min-height:44px; margin-left:6px; padding:6px 8px; font:inherit; font-size:15px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; }
.meta { font-size:14px; color:var(--muted); }
.note { background:var(--warnbg); color:var(--warn); padding:8px 12px; margin:12px 0; font-size:15px; }
.evidence { background:var(--evbg); border-left:3px solid var(--accent); padding:8px 12px; margin:12px 0; font-size:15px; }
.evidence.none { background:none; border-left-color:var(--line); color:var(--muted); }
blockquote { margin:6px 0 0; font-style:italic; }
img { display:block; width:100%; height:auto; margin-top:12px; border:1px solid var(--line); border-radius:4px; }
.asmt .badge { margin-left:8px; }
.fig { margin:12px 0; }
.fig img { margin-top:0; background:#fff; }
.fig .meta { margin-top:4px; }
.asmt .fig img { max-width:420px; }
.foot { font-size:13px; color:var(--muted); border-top:1px dashed var(--line); padding-top:6px; margin:8px 0; }
.asmt button { margin-top:6px; padding:6px 10px; font-size:13px; }
.asmt { font-size:14px; border-top:1px solid var(--line); padding:8px 0; }
.actions { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 16px; }
.actions div { display:flex; gap:8px; max-width:648px; margin:0 auto; }
button { min-height:44px; }
.actions button, .gate button { flex:1; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; padding:8px; }
.actions .primary, .gate button { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
#sync { font-size:13px; color:var(--muted); margin-left:auto; margin-right:8px; }
#sync.busy { color:var(--warn); }
#sync.error { color:var(--bad); font-weight:600; }
.link { background:none; border:none; color:var(--muted); font:inherit; font-size:14px; text-decoration:underline; padding:0 4px; }
input, textarea { width:100%; padding:10px; margin:8px 0; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
.status { color:var(--muted); padding:12px 0; }
.status.error { color:var(--bad); }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="bar"><h1>Pulse review</h1><span id="sync" role="status"></span><button id="forget" class="link" hidden>Remove token</button></div>

  <form id="gate" class="gate" hidden>
    <label for="token">GitHub token</label>
    <input id="token" type="password" autocomplete="off" required>
    <button type="submit">Open cards</button>
    <p class="meta">Saved only in this browser and sent only to api.github.com.</p>
  </form>

  <section id="app" hidden>
    <div class="pick">
      <label>Subject<select id="subject"></select></label>
      <label>Chapter<select id="chapter"></select></label>
      <label>Tier<select id="tier"></select></label>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="card"></div>
  </section>
  <p id="status" class="status" role="status"></p>
</main>
<div class="actions" id="actions" hidden><div>
  <button id="prev">Back</button>
  <button id="fix">Needs fix</button>
  <button id="approve" class="primary">Approve</button>
  <button id="next">Skip</button>
</div></div>

<script>
"use strict";
const OWNER = "dr-nithish-kanna";
const REPO = "pulse";
const BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const TOKEN_KEY = "pulse_token";
const PICK_KEY = "pulse_pick"; // remembers subject + chapter in this browser only
const ALL = "";
const NUMBER = /\d|\b(two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/i;
const FILTERS = [["draft", "Pending"], ["needs_review", "Flagged"], ["approved", "Approved"], ["archived", "Archived"]];
const TIERS = [["high_yield", "High-yield"], ["core", "Core"], ["later", "Later"]];
const TIER_RANK = { high_yield: 0, core: 1, later: 2 };
const tierLabel = (t) => (TIERS.find(([v]) => v === t) ?? [t, t ?? "No tier"])[1];
const KIND_LABEL = { mcq: "MCQ", fill_blank: "Fill in the blank", true_false: "True / False", recall: "Recall" };

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text; // textContent, so card text can never run as code
  return n;
};
const store = {
  get(key = TOKEN_KEY) { try { return localStorage.getItem(key); } catch { return null; } },
  set(v, key = TOKEN_KEY) { try { localStorage.setItem(key, v); } catch {} },
  clear() { try { localStorage.removeItem(TOKEN_KEY); } catch {} },
};

let token = null;
let cards = [];        // { card, file, subject, chapter }
let topics = new Map(); // topic id -> topic
let subject = ALL;
let chapter = ALL;
let tier = ALL;
let assessments = [];
let filter = "draft";
let index = 0;
let shownImage = null;
let images = new Map();   // image id -> { item, file }   (content/images/images.json)
let glossary = { list: [], ignore: new Set() }; // content/abbreviations.json, for card footnotes
const svgUrls = new Map(); // image file -> blob URL (drawn as <img>, so an SVG can never run code)
const IMAGES_FILE = "content/images/images.json";
let renderId = 0;

function setStatus(message, isError = false) {
  $("status").textContent = message;
  $("status").className = isError ? "status error" : "status";
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    cache: "no-store", // never reuse an old copy: a stale file version makes saves fail
    ...options,
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", ...options.headers },
  });
  if (!res.ok) {
    const detail = await res.json().then((j) => j.message, () => "");
    const err = new Error(`GitHub error ${res.status}${detail ? `: ${detail}` : ""}`);
    err.status = res.status;
    throw err;
  }
  return res;
}
const getJson = async (path) => (await api(path)).json();
const pathUrl = (path) => path.split("/").map(encodeURIComponent).join("/");
const getRaw = (path) =>
  api(`${pathUrl(path)}?ref=${BRANCH}`, { headers: { Accept: "application/vnd.github.raw+json" } });

const decode = (b64) =>
  new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), (c) => c.charCodeAt(0)));
const encode = (text) => {
  let bin = "";
  new TextEncoder().encode(text).forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
};

async function loadList(dir) {
  const files = (await getJson(`content/${dir}?ref=${BRANCH}`)).filter((f) => f.name.endsWith(".json"));
  const lists = await Promise.all(files.map(async (f) => ({
    path: f.path,
    items: await (await getRaw(f.path)).json(),
  })));
  return lists.flatMap((l) => l.items.map((item) => ({ item, file: l.path })));
}

// Subject = top of the topic tree (e.g. Medicine, Pathology). Chapter = the level below it (e.g. Cardiology).
function placeOf(card) {
  const chain = [];
  let id = card.topics?.[0]?.topic_id;
  while (id && topics.has(id) && !chain.includes(id)) {
    chain.unshift(id);
    id = topics.get(id).parent_id;
  }
  if (!chain.length) return { subject: "?", chapter: "?" };
  return { subject: chain[0], chapter: chain[1] ?? chain[0] };
}
const topicName = (id) => (id === "?" ? "Not in topic tree" : topics.get(id)?.name ?? id);
const byOrder = (a, b) => (topics.get(a)?.order ?? 999) - (topics.get(b)?.order ?? 999) || topicName(a).localeCompare(topicName(b));

async function loadAll() {
  setStatus("Loading cards...");
  const [c, a, t] = await Promise.all([loadList("cards"), loadList("assessments"), loadList("topics")]);
  // Pictures and abbreviations (Cardiology pilot). Missing files just mean none yet.
  const optional = async (path, fallback) => { try { return await (await getRaw(path)).json(); } catch { return fallback; } };
  const [imgs, abbr, ignore] = await Promise.all([optional(IMAGES_FILE, []), optional("content/abbreviations.json", []), optional("content/abbreviations_ignore.json", { words: [] })]);
  images = new Map(imgs.map((item) => [item.id, { item, file: IMAGES_FILE }]));
  glossary = { list: [...abbr].sort((x, y) => y.abbr.length - x.abbr.length), ignore: new Set(ignore.words) };
  topics = new Map(t.map(({ item }) => [item.id, item]));
  assessments = a; // { item, file }
  // Cards that already have questions come first, so card and questions are reviewed together.
  const withQuestions = new Set(a.filter((x) => x.item.status !== "retired").map((x) => x.item.card_id));
  const rank = (e) => (withQuestions.has(e.card.id) ? 2 : 0) + (e.card.source?.[0]?.page ? 1 : 0);
  const tierRank = (e) => TIER_RANK[e.card.review_tier] ?? 3;
  cards = c.map(({ item, file }) => ({ card: item, file, ...placeOf(item) }))
    .sort((x, y) => tierRank(x) - tierRank(y) || rank(y) - rank(x)); // High-yield first
  try { ({ subject = ALL, chapter = ALL, tier = ALL } = JSON.parse(store.get(PICK_KEY)) ?? {}); } catch {}
  setStatus("");
  $("gate").hidden = true;
  $("app").hidden = false;
  $("forget").hidden = false;
  render();
}

const picked = () => cards.filter((c) =>
  (subject === ALL || c.subject === subject) && (chapter === ALL || c.chapter === chapter) &&
  (tier === ALL || c.card.review_tier === tier));
const visible = () => picked().filter((c) => c.card.status === filter);

function fillSelect(select, ids, value, allLabel) {
  const options = [[ALL, allLabel], ...ids.map((id) => [id, topicName(id)])].map(([v, label]) => {
    const o = el("option", "", label);
    o.value = v;
    return o;
  });
  select.replaceChildren(...options);
  select.value = value;
}

function renderPickers() {
  const subjects = [...new Set(cards.map((c) => c.subject))].sort(byOrder);
  if (!subjects.includes(subject)) subject = ALL;
  const chapters = [...new Set(cards.filter((c) => subject === ALL || c.subject === subject).map((c) => c.chapter))].sort(byOrder);
  if (!chapters.includes(chapter)) chapter = ALL;
  fillSelect($("subject"), subjects, subject, "All subjects");
  fillSelect($("chapter"), chapters, chapter, "All chapters");
  const options = [[ALL, "All tiers"], ...TIERS].map(([v, label]) => {
    const o = el("option", "", label);
    o.value = v;
    return o;
  });
  $("tier").replaceChildren(...options);
  $("tier").value = tier;
}

function pick(newSubject, newChapter, newTier = tier) {
  subject = newSubject;
  chapter = newChapter;
  tier = newTier;
  store.set(JSON.stringify({ subject, chapter, tier }), PICK_KEY);
  index = 0;
  render();
}
$("subject").onchange = (e) => pick(e.target.value, ALL);
$("chapter").onchange = (e) => pick(subject, e.target.value);
$("tier").onchange = (e) => pick(subject, chapter, e.target.value);

function renderTabs() {
  const tabs = $("tabs");
  const pool = picked();
  tabs.replaceChildren(...FILTERS.map(([value, label]) => {
    const b = el("button", "", `${label} ${pool.filter((c) => c.card.status === value).length}`);
    b.type = "button";
    b.setAttribute("aria-pressed", String(filter === value));
    b.onclick = () => { filter = value; index = 0; render(); };
    return b;
  }));
}

async function loadEvidence(id, box, thisRender) {
  let evidence;
  try {
    evidence = await (await getRaw(`sources/evidence/${id}.json`)).json();
  } catch (e) {
    if (thisRender !== renderId) return;
    box.className = "evidence none";
    box.textContent = e.status === 404 ? "No evidence file" : "Could not load evidence";
    return;
  }
  if (thisRender !== renderId) return;
  box.className = "evidence";
  const line = el("div");
  line.append(el("strong", "", `Page ${evidence.page}: `), evidence.locator ?? "");
  box.replaceChildren(line);
  if (evidence.phrase) box.append(el("blockquote", "", evidence.phrase));
  if (!evidence.image) return;

  // The page photo is only downloaded when asked for, to save time and data.
  const show = el("button", "", "Load page");
  show.type = "button";
  box.append(show);
  show.onclick = () => showPage(evidence, show, thisRender);
}

async function showPage(evidence, button, thisRender) {
  const waiting = el("div", "meta", "Loading textbook page...");
  button.replaceWith(waiting);
  try {
    const blob = await (await getRaw(evidence.image)).blob();
    if (thisRender !== renderId) return;
    const url = URL.createObjectURL(blob);
    if (shownImage) URL.revokeObjectURL(shownImage);
    shownImage = url;
    if (evidence.image.toLowerCase().endsWith(".pdf")) {
      const open = el("a", "", "Open the PDF page");
      open.href = url;
      open.target = "_blank";
      open.rel = "noopener";
      waiting.replaceWith(open);
    } else {
      const img = el("img");
      img.alt = `Textbook page ${evidence.page}`;
      img.src = url;
      waiting.replaceWith(img);
    }
  } catch {
    if (thisRender === renderId) waiting.textContent = "Could not load the textbook page";
  }
}

// Footnote: the abbreviations a card uses, from the shared list (same rules as tools/lib/abbreviations.mjs in pulse).
function footnoteOf(text) {
  const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const hits = [];
  for (const e of glossary.list) {
    const re = new RegExp(`(?<![A-Za-z0-9])${esc(e.abbr)}${e.prefix ? "(\\d+)" : "s?"}(?![A-Za-z0-9])`, "g");
    const skip = e.skip ? new RegExp(e.skip) : null;
    for (const m of text.matchAll(re)) {
      if (skip && skip.test(text.slice(Math.max(0, m.index - 12), m.index + m[0].length + 1))) continue;
      if (hits.some((h) => m.index < h.end && h.at < m.index + m[0].length)) continue; // longer entry already matched here
      hits.push({ at: m.index, end: m.index + m[0].length, abbr: e.prefix ? e.abbr + m[1] : e.abbr, full: e.prefix ? `${e.full} ${m[1]}` : e.full });
    }
  }
  const seen = new Set();
  return hits.sort((x, y) => x.at - y.at).filter((h) => !seen.has(h.abbr) && seen.add(h.abbr));
}

// A picture with its status badge (and caption on the card itself). Loaded on demand from the private repo.
function figureOf(imageId, withCaption, thisRender) {
  const entry = images.get(imageId);
  const box = el("div", "fig");
  if (!entry) { box.append(el("div", "meta", `Picture ${imageId} not found`)); return box; }
  const img = el("img");
  img.alt = entry.item.alt;
  const info = el("div", "meta");
  info.append(el("span", "badge", `picture ${entry.item.status}`), " ", withCaption ? entry.item.caption ?? "" : "");
  box.append(img, info);
  const file = entry.item.file;
  (svgUrls.has(file) ? Promise.resolve(svgUrls.get(file)) : getRaw(`content/images/${file}`).then((r) => r.text()).then((svg) => {
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    svgUrls.set(file, url);
    return url;
  })).then((url) => { if (thisRender === renderId) img.src = url; }, () => { info.prepend("Could not load picture. "); });
  return box;
}

function render() {
  const thisRender = ++renderId;
  renderPickers();
  renderTabs();
  const list = visible();
  index = Math.max(0, Math.min(index, list.length - 1));
  const root = $("card");
  if (!list.length) {
    root.replaceChildren(el("p", "status", "Nothing here."));
    $("actions").hidden = true;
    return;
  }
  const { card } = list[index];
  const article = el("article");
  const top = el("div", "top");
  top.append(el("span", "", `${index + 1} of ${list.length}`), el("code", "", card.id));
  top.append(el("span", `badge tier-${card.review_tier ?? "none"}`, tierLabel(card.review_tier)));
  if (card.more_questions) top.append(el("span", "badge more", `${card.more_questions.count ?? "More"} more questions requested`));
  if (NUMBER.test(`${card.text} ${card.answer ?? ""}`)) top.append(el("span", "badge", "number"));
  if (card.status === "approved" && draftExtras(card)) top.append(el("span", "badge more", `${draftExtras(card)} new to approve`));
  article.append(top, el("p", "text", card.text));
  if (card.image) article.append(figureOf(card.image, true, thisRender));
  const foot = footnoteOf([card.text, card.explanation, card.mnemonic, images.get(card.image)?.item.caption].filter(Boolean).join("\n"));
  if (foot.length) {
    const f = el("div", "foot");
    foot.forEach((x, i) => { if (i) f.append("  \u00b7  "); f.append(el("b", "", x.abbr), `: ${x.full}`); });
    article.append(f);
  }
  if (card.answer) article.append(el("div", "meta", `Answer: ${card.answer}`));
  const source = (card.source ?? [])
    .map((s) => [s.book, s.chapter, s.page && `p. ${s.page}`].filter(Boolean).join(", ")).join("; ");
  article.append(el("div", "meta", `Source: ${source}`));
  if (card.review_note) article.append(el("div", "note", `Note: ${card.review_note}`));
  if (card.more_questions?.note) article.append(el("div", "meta", `Extra questions should cover: ${card.more_questions.note}`));

  const box = el("div", "evidence none", "Loading evidence...");
  article.append(box);
  for (const entry of assessments.filter((x) => x.item.card_id === card.id)) {
    const a = entry.item;
    const row = el("div", "asmt");
    if (a.image) row.append(figureOf(a.image, false, thisRender));
    row.append(el("span", "badge kind", KIND_LABEL[a.kind] ?? a.kind), a.prompt, el("span", "badge", a.status));
    row.append(el("div", "meta", `Correct: ${a.correct.join(" / ")}`));
    if (a.distractors) row.append(el("div", "meta", `Wrong: ${a.distractors.join(", ")}`));
    if (a.explanation) row.append(el("div", "meta", `Why: ${a.explanation}`));
    if (a.status !== "retired") {
      const drop = el("button", "", "Drop this question");
      drop.type = "button";
      drop.onclick = () => dropAssessment(entry);
      row.append(drop);
    }
    article.append(row);
  }
  const tools = el("div", "cardtools");
  const tierPick = el("label", "", "Tier");
  const tierSelect = el("select");
  tierSelect.append(...TIERS.map(([v, label]) => {
    const o = el("option", "", label);
    o.value = v;
    return o;
  }));
  tierSelect.value = card.review_tier ?? "core";
  tierSelect.onchange = (e) => setTier(e.target.value);
  tierPick.append(tierSelect);
  tools.append(tierPick);
  const more = el("button", "", card.more_questions ? "Change question request" : "More questions");
  more.type = "button";
  more.onclick = () => { more.hidden = true; tools.append(moreBox(card)); };
  tools.append(more);
  if (card.status === "archived") {
    const restore = el("button", "", "Restore this card");
    restore.type = "button";
    restore.onclick = restoreCard;
    tools.append(restore);
  } else {
    const archive = el("button", "", "Archive (low yield)");
    archive.type = "button";
    archive.onclick = archiveCard;
    tools.append(archive);
  }
  article.append(tools);
  root.replaceChildren(article);
  $("actions").hidden = false;
  // An approved card can still have new draft questions or pictures (e.g. image questions added later).
  const extras = draftExtras(card);
  $("approve").disabled = card.status === "approved" && !extras;
  $("approve").textContent = card.status === "approved" && extras ? `Approve ${extras} new` : "Approve";
  $("fix").disabled = false;
  $("prev").disabled = index === 0;
  $("next").disabled = index >= list.length - 1;
  window.scrollTo(0, 0);
  loadEvidence(card.id, box, thisRender);
}

// Always re-reads the file, so a save never overwrites newer work. Retries if two saves collide.
// `changes` maps item id -> function that edits that item.
async function saveItems(file, changes, message) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const meta = await getJson(`${pathUrl(file)}?ref=${BRANCH}`);
    const content = meta.content
      ? decode(meta.content)
      : await (await getRaw(file)).text();
    const list = JSON.parse(content);
    const fresh = new Map();
    for (const [id, change] of changes) {
      const item = list.find((c) => c.id === id);
      if (!item) throw new Error("An item no longer exists. Reload the page.");
      change(item);
      fresh.set(id, item);
    }
    try {
      await api(pathUrl(file), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message,
          branch: BRANCH,
          sha: meta.sha,
          content: encode(JSON.stringify(list, null, 2) + "\n"),
        }),
      });
      return fresh;
    } catch (e) {
      if ((e.status !== 409 && e.status !== 422) || attempt === 2) throw e;
      await new Promise((r) => setTimeout(r, 1000 * (attempt + 1))); // let GitHub catch up, then re-read
    }
  }
}

// ---- Background save queue ----
// A tap changes the card on screen at once; saves go to GitHub a moment later,
// combined into one commit per file. Each save re-reads the file first, so it never
// overwrites newer work.
const queue = new Map(); // file -> { changes: Map(id -> [fn]), messages: [] }
let flushTimer = null;
let flushing = false;
let retryDelay = 3000;

function pendingCount() {
  let n = 0;
  for (const q of queue.values()) n += q.changes.size;
  return n;
}

function showSync(error) {
  const box = $("sync");
  const n = pendingCount();
  if (error) {
    box.className = "error";
    box.textContent = `Not saved yet (${n}), retrying`;
  } else if (n || flushing) {
    box.className = "busy";
    box.textContent = `Saving ${n || ""}...`.replace("  ", " ");
  } else {
    box.className = "";
    box.textContent = "All saved \u2713";
  }
}

function enqueue(file, item, change, message) {
  change(item); // update the screen now
  if (!queue.has(file)) queue.set(file, { changes: new Map(), messages: [] });
  const q = queue.get(file);
  if (!q.changes.has(item.id)) q.changes.set(item.id, []);
  q.changes.get(item.id).push(change);
  q.messages.push(message);
  scheduleFlush(2000);
  showSync();
}

function scheduleFlush(ms) {
  if (flushTimer) return;
  flushTimer = setTimeout(() => { flushTimer = null; flush(); }, ms);
}

async function flush() {
  if (flushing || !queue.size) return;
  flushing = true;
  showSync();
  let failed = false;
  for (const [file, q] of [...queue]) {
    queue.delete(file); // later taps start a new batch for this file
    const changes = new Map([...q.changes].map(([id, fns]) => [id, (item) => fns.forEach((fn) => fn(item))]));
    const message = q.messages.length === 1 ? q.messages[0]
      : `Review page: ${q.messages.length} changes\n\n${q.messages.join("\n")}`;
    try {
      await saveItems(file, changes, message);
    } catch (e) {
      failed = true;
      // Put the batch back in front of anything newer for the same file.
      const newer = queue.get(file);
      if (newer) {
        for (const [id, fns] of newer.changes) q.changes.set(id, [...(q.changes.get(id) ?? []), ...fns]);
        q.messages.push(...newer.messages);
      }
      queue.set(file, q);
      console.error(e);
    }
  }
  flushing = false;
  if (failed) {
    showSync(true);
    scheduleFlush(retryDelay);
    retryDelay = Math.min(retryDelay * 2, 60000);
  } else {
    retryDelay = 3000;
    if (queue.size) scheduleFlush(1000);
    showSync();
  }
}

window.addEventListener("beforeunload", (e) => {
  if (pendingCount() || flushing) { e.preventDefault(); e.returnValue = ""; }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && queue.size) { clearTimeout(flushTimer); flushTimer = null; flush(); }
});

/** Draft questions and draft pictures belonging to a card. */
function draftExtras(card) {
  const qs = assessments.filter((e) => e.item.card_id === card.id && e.item.status === "draft");
  const pics = new Set([card.image, ...qs.map((e) => e.item.image)].filter((id) => images.get(id)?.item.status === "draft"));
  return qs.length + pics.size;
}

// Approving a card also approves its draft questions and draft pictures (the card's own and those of
// the questions approved with it). Anything flagged needs_review or retired is left alone.
function approveDraftAssessments(card) {
  const pictures = new Set(card.image ? [card.image] : []);
  for (const entry of assessments) {
    if (entry.item.card_id !== card.id || entry.item.status !== "draft") continue;
    enqueue(entry.file, entry.item, (a) => { a.status = "approved"; }, `Approve question ${entry.item.id}`);
    if (entry.item.image) pictures.add(entry.item.image);
  }
  for (const id of pictures) {
    const entry = images.get(id);
    if (entry && entry.item.status === "draft") enqueue(entry.file, entry.item, (i) => { i.status = "approved"; }, `Approve picture ${id}`);
  }
}

function dropAssessment(entry) {
  if (!confirm("Drop this question? It will be retired, not deleted.")) return;
  enqueue(entry.file, entry.item, (a) => { a.status = "retired"; }, `Retire ${entry.item.id}`);
  render();
}

function act(change, message, done, after) {
  const entry = visible()[index];
  enqueue(entry.file, entry.card, change, message);
  if (after) after();
  setStatus(done);
  render();
}

$("approve").onclick = () => {
  const { card } = visible()[index];
  if (card.status === "approved") { // only the new questions and pictures
    approveDraftAssessments(card);
    setStatus("New questions and pictures approved");
    render();
    return;
  }
  act((c) => { c.status = "approved"; delete c.archived_from; }, `Approve ${card.id}`, "Approved", () => approveDraftAssessments(card));
};

$("fix").onclick = () => {
  const { card } = visible()[index];
  const note = prompt("What needs fixing?");
  if (!note || !note.trim()) return;
  act((c) => {
    c.status = "needs_review";
    c.review_note = [c.review_note, `fix: ${note.trim()}`].filter(Boolean).join("; ");
  }, `Flag ${card.id} for a fix`, "Marked for fixing");
};

// Archive = hide a low-yield card without deleting it. Restore puts back its old status.
function archiveCard() {
  const { card } = visible()[index];
  if (!confirm("Archive this card? You can restore it from the Archived tab.")) return;
  act((c) => {
    c.archived_from = c.status;
    c.status = "archived";
    c.review_note = [c.review_note, "archived from review page"].filter(Boolean).join("; ");
  }, `Archive ${card.id}`, "Archived");
}

function setTier(value) {
  const { card } = visible()[index];
  act((c) => { c.review_tier = value; }, `Set ${card.id} tier to ${value}`, `Tier: ${tierLabel(value)}`);
}

// Marks a card for extra questions. The next question-writing session picks these up
// (tools/question_requests.mjs in the pulse repo), writes them as drafts and clears the mark.
// Panel with a slider for how many extra questions, and an optional note.
function moreBox(card) {
  const box = el("div", "morebox");
  const start = card.more_questions?.count ?? 5;
  const label = el("div", "", "");
  const count = el("span", "count", String(start));
  label.append("Add ", count, " more questions");
  const slider = el("input");
  slider.type = "range";
  slider.min = "1";
  slider.max = "15";
  slider.value = String(start);
  slider.oninput = () => { count.textContent = slider.value; };
  const note = el("input");
  note.type = "text";
  note.placeholder = "What should they cover? (optional)";
  note.value = card.more_questions?.note ?? "";
  const row = el("div", "row");
  const save = el("button", "", "Save request");
  save.type = "button";
  save.onclick = () => requestQuestions(Number(slider.value), note.value.trim());
  row.append(save);
  if (card.more_questions) {
    const cancel = el("button", "", "Remove request");
    cancel.type = "button";
    cancel.onclick = cancelQuestions;
    row.append(cancel);
  }
  box.append(label, slider, note, row);
  return box;
}

function requestQuestions(n, note) {
  const { card } = visible()[index];
  act((c) => { c.more_questions = note ? { count: n, note } : { count: n }; },
    `Request ${n} more questions for ${card.id}`, `${n} more questions requested`);
}

function cancelQuestions() {
  const { card } = visible()[index];
  act((c) => { delete c.more_questions; }, `Cancel question request for ${card.id}`, "Request cancelled");
}

function restoreCard() {
  const { card } = visible()[index];
  act((c) => {
    c.status = c.archived_from ?? "draft";
    delete c.archived_from;
  }, `Restore ${card.id}`, "Restored");
}

$("prev").onclick = () => { index--; render(); };
$("next").onclick = () => { index++; render(); };

function start() {
  loadAll().catch((e) => {
    const bad = e.status === 401 || e.status === 403 || e.status === 404;
    if (bad) { store.clear(); token = null; }
    setStatus(bad ? "GitHub refused that token. Check it can read and write the pulse repo." : e.message, true);
    $("gate").hidden = false;
  });
}

$("gate").onsubmit = (event) => {
  event.preventDefault();
  token = $("token").value.trim();
  $("token").value = "";
  store.set(token);
  start();
};

$("forget").onclick = () => {
  store.clear();
  location.reload();
};

token = store.get();
if (token) start(); else $("gate").hidden = false;
</script>
</body>
